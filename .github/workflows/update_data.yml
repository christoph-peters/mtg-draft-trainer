name: Update Card Data

on:
  # Run every Monday at 03:00 UTC
  schedule:
    - cron: '0 3 * * 1'
  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      sets:
        description: 'Space-separated set codes to update (e.g. "MSH SOS TDM"). Leave empty for the default active sets.'
        required: false
        default: ''
      delay:
        description: 'Seconds between 17Lands requests (default: 3)'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Determine sets to update
        id: sets
        run: |
          INPUT="${{ github.event.inputs.sets }}"
          if [ -n "$INPUT" ]; then
            echo "sets=$INPUT" >> $GITHUB_OUTPUT
          else
            # Default: update the 6 most recent sets (stats accumulate fast for new sets,
            # old sets are essentially frozen). Edit this list when a new set is added.
            echo "sets=MSH SOS TMT ECL TLA SPM" >> $GITHUB_OUTPUT
          fi

      - name: Fetch card data for each set
        run: |
          DELAY="${{ github.event.inputs.delay || '3' }}"
          for SET in ${{ steps.sets.outputs.sets }}; do
            echo "━━━ Fetching $SET ━━━"
            python3 backend/fetch_set_data.py "$SET" --delay "$DELAY"
          done

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/
          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No data changes detected — skipping commit."
          else
            SETS="${{ steps.sets.outputs.sets }}"
            git commit -m "chore(data): auto-update card data for ${SETS// /, }"
            git push
          fi
