name: Add New Set

on:
  workflow_dispatch:
    inputs:
      set_code:
        description: '3-letter MTG set code (e.g. MSH)'
        required: true
      display_name:
        description: 'Display name shown in the UI — include year suffix (e.g. "Marvel Super Heroes (2026)"). Defaults to Scryfall name.'
        required: false
        default: ''
      delay:
        description: 'Seconds between 17Lands requests (default: 3)'
        required: false
        default: '3'

permissions:
  contents: write
  pull-requests: write

jobs:
  add-set:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Add new set
        run: |
          ARGS="${{ github.event.inputs.set_code }}"
          ARGS="$ARGS --delay ${{ github.event.inputs.delay || '3' }}"
          if [ -n "${{ github.event.inputs.display_name }}" ]; then
            ARGS="$ARGS --name '${{ github.event.inputs.display_name }}'"
          fi
          eval python3 backend/add_new_set.py $ARGS

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: add-set-${{ github.event.inputs.set_code }}
          base: develop
          commit-message: "feat(data): add ${{ github.event.inputs.set_code }} card data and register set"
          title: "➕ Add new set: ${{ github.event.inputs.set_code }}"
          body: |
            ## New Set: `${{ github.event.inputs.set_code }}`

            Auto-generated by the **Add New Set** workflow.

            ### Changes
            - `frontend/public/data/${{ github.event.inputs.set_code }}_metadata.json` — card images & prices (Scryfall)
            - `frontend/public/data/${{ github.event.inputs.set_code }}_stats.json` — pick order & win rates (17Lands)
            - `frontend/src/utils.js` — set added to the top of the `SETS` array
            - `.github/workflows/update_data.yml` — set added to the weekly auto-update list

            ### Review checklist
            - [ ] Display name looks right in `utils.js` (add year suffix if needed)
            - [ ] `_metadata.json` is non-empty
            - [ ] `_stats.json` has reasonable data (may be sparse for very new sets)
            - [ ] Merge → triggers automatic deploy to GitHub Pages
          labels: automated, new-set
